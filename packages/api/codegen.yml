{
    overwrite: true,
    schema: ${API_URL},
    documents: [../**/*.gql, ../**/*.gql],
    config: {
        scalars: {
            TDate: Date
        }
    },
    generates: {
        ./src/database/schema.ts: {
            plugins: [
                typescript,
                typescript-resolvers
            ],
            config: {
                preResolveTypes: false,
                maybeValue: Partial<T> | T | null,
                useTypeImports: true,
                typesPrefix: T,
                addDocBlocks: true,
                dedupeFragments: true,
                omitOperationSuffix: true,
                namingConvention: {
                    typeNames: pascal-case#pascalCase,
                    transformUnderscore: true
                }
            }
        }
    }
    }
