query QFavorites {
    favorites {
        dateCreated
        dateModified
        dateTaken
        id
        filenameDisk
        filenameDownload
        title
        description
        lat
        lng
        status
        mimetype
        favorites {
            id
        }
        owner {
            id
        }
        uploader {
            id
        }
        meta {
            ...on ImageMeta {
                width
                height
                cameraMake
                cameraModel
                flash
                fNumber
                iso
            }
            ...on VideoMeta {
                width
                height
                duration
            }
        }
    }
}
