query AlbumMediaQuery($id: ID!) {
    albumMedia(id: $id) {
        dateCreated
        dateModified
        dateTaken
        id
        filenameDisk
        filenameDownload
        title
        description
        lat
        lng
        status
        mimetype
        meta {
            ...on ImageMeta {
                width
                height
                cameraMake
                cameraModel
                flash
                fNumber
                iso
            }
            ...on VideoMeta {
                width
                height
                duration
            }
        }
    }
}
