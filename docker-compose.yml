version: '3.9'

networks:
    proxy:
        ipam:
            driver: default
            config:
                - subnet: 10.5.0.0/16

volumes:
    search-data:
        driver: local

services:
    api:
        container_name: api_c
        platform: linux/x86_64
        restart: unless-stopped
        build:
            context: .
            target: api
        entrypoint: ['node', 'api/dist']
        depends_on:
            - db
        environment:
            PORT: 11011
        ports:
            - "11011:11011"
            - "11012:11012"
        expose:
            - 11011
            - 9229
            - 11012
        stdin_open: true
        tty: true
    app:
        container_name: app_c
        platform: linux/x86_64
        restart: unless-stopped
        build:
            context: .
            target: app
        environment:
            PORT: 3030
        entrypoint: ['node', 'app/server.js']
        ports:
            - "3030:3030"
        expose:
            - 3030
        stdin_open: true
        tty: true

    db:
        container_name: db_c
        image: postgres
        restart: unless-stopped
        environment:
            - POSTGRES_USER=stefanbaumeler
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=photos
        ports:
            - "5555:5432"
        expose:
            - 5555
    search:
        container_name: search_c
        image: typesense/typesense:0.23.1
        restart: unless-stopped
        entrypoint: sh -c "/opt/typesense-server --data-dir /data --api-key=asdf --enable-cors"
        ports:
            - "8108:8108"
        volumes:
            - search-data:/data
