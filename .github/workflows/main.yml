name: Cypress Tests

on: [push]

env:
    NODE_ENV: test

jobs:
    cypress-run:
        services:
            postgres:
                image: postgres
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                  - 5432:5432
                env:
                    POSTGRES_DB: photos
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: stefanbaumeler
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v2
            - name: Setup Yarn
              uses: actions/setup-node@v3
              with:
                  node-version: 16
                  cache: 'yarn'
            - name: Install dependencies
              run: yarn install --frozen-lockfile --immutable
            - name: Setup test environment
              run: NODE_ENV=test yarn test:setup
            - name: Run test servers
              run: NODE_ENV=test yarn watch
            - name: Cypress Tests
              uses: cypress-io/github-action@v4.2.0
              with:
                  test: NODE_ENV=test yarn cy
