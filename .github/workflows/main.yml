name: Tests

on: [ push ]

env:
    NODE_ENV: ci

jobs:
    tests-run:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v3
            -   uses: docker/setup-buildx-action@v2
            -   uses: docker/build-push-action@v4
                with:
                    context: .
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
            -   name: Test
                run: docker-compose up
