name: Cypress Tests

on: [push]

jobs:
    cypress-run:
        services:
            postgres:
                image: postgres
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                env:
                    POSTGRES_PASSWORD: postgres
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v2
            - name: Install dependencies
              run: yarn install
            - name: Setup DB
              run: yarn db:up
            - name: Cypress Tests
              uses: cypress-io/github-action@v4.2.0
              with:
                  start: yarn start
                  cy: yarn cy
