name: Tests

on: [push]

env:
    NODE_ENV: test

jobs:
    tests-run:
        services:
            postgres:
                image: postgres
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                  - 5432:5432
                env:
                    POSTGRES_DB: cy-photos
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: stefanbaumeler
            typesense:
                image: typesense/typesense:0.23.1
                ports:
                    - 8108:8108
                entrypoint: sh -c "/opt/typesense-server --data-dir /data --api-key=asdf --enable-cors"
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v2
            - name: Setup Yarn
              uses: actions/setup-node@v3
              with:
                  node-version: 18.12.1
                  cache: 'yarn'
            - name: Install dependencies
              run: yarn install --frozen-lockfile --immutable
            - name: Build Servers
              run: yarn build
              env:
                  NODE_ENV: test
            - name: Tests
              run: yarn test
              env:
                  NODE_ENV: test
